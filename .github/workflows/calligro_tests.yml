name: Calligro Master Test Suite

on:
  push:
    branches: [ "main", "updated-main" ]
  pull_request:
    branches: [ "main", "updated-main" ]

jobs:
  flutter_tests:
    name: Flutter Mobile Tests (Domains 2 & 3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Install Flutter Dependencies
        run: flutter pub get
        
      # test/ mirrors lib/ (test/features/<feature>/<layer>, test/core, test/screens),
      # plus the architecture guard-rails. See ARCHITECTURE.md.
      - name: Run all app tests (domain, application, data, screens, guard-rails)
        run: flutter test

  calligro_meet_backend_tests:
    name: Calligro Meet Cloud Functions Tests (LiveKit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./functions
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22' # matches "engines" in functions/package.json

      - name: Install Functions Dependencies
        run: npm ci

      - name: Run LiveKit Function Tests
        run: npx jest test/livekit.test.js test/transcoder.test.js

  security_rules_tests:
    name: Firestore & Storage Security Rules (emulators)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Setup Java (for the emulators)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Functions Dependencies
        working-directory: ./functions
        run: npm ci

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install Web Portal Dependencies (for the Whop enrolment test)
        working-directory: ./web_portal
        run: npm install --legacy-peer-deps

      - name: Run rules tests against the Firestore + Storage emulators
        run: >
          firebase emulators:exec --only firestore,storage --project demo-calligro
          "cd functions && npx jest test/security_rules.test.js test/community_rules.test.js test/storage_rules.test.js test/migrate_payout_private.test.js test/profile_sync.test.js test/profile_rules.test.js test/course_rules.test.js test/purchases.test.js test/schedule.test.js test/reschedule_notice.test.js test/notifications.test.js"

      - name: Run Whop enrolment tests against the Firestore emulator
        run: >
          firebase emulators:exec --only firestore --project demo-calligro
          "cd web_portal && npx vitest run tests/features/payments/whop_enrollment.test.ts tests/features/courses/courses_data.test.ts tests/features/certificates"

  web_portal_tests:
    name: Web Portal Finance Tests (Domain 1)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web_portal
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          
      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps
        
      - name: Run Finance Webhook Tests
        run: npx vitest run tests/finance.test.ts tests/features/payments/whop_webhook.test.ts tests/features/payments/whop_checkout.test.ts tests/features/payments/whop_checkout_client.test.ts tests/features/courses/course_policy.test.ts tests/guardrails.test.ts

  deploy_ios:
    name: Deploy to Apple TestFlight (CD)
    needs: [flutter_tests, web_portal_tests, calligro_meet_backend_tests, security_rules_tests] # Only deploy if all tests pass
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ./ios
    steps:
      - uses: actions/checkout@v3
      - name: Setup Ruby and Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.0'
          bundler-cache: true
      - name: Deploy Beta to TestFlight
        run: fastlane beta

  deploy_android:
    name: Deploy to Google Play Beta (CD)
    needs: [flutter_tests, web_portal_tests, calligro_meet_backend_tests, security_rules_tests] # Only deploy if all tests pass
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./android
    steps:
      - uses: actions/checkout@v3
      - name: Setup Ruby and Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.0'
          bundler-cache: true
      - name: Deploy Beta to Google Play
        run: fastlane beta
